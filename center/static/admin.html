<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>center 主控端</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <h1>center 主控端</h1>
    <div id="status-line" class="status-line">加载中…</div>
  </header>

  <main>
    <section class="panel">
      <h2>配置</h2>
      <form id="config-form">
        <div class="row">
          <label>摄像头模式
            <select name="mode">
              <option value="single">单摄像头（拍双方）</option>
              <option value="dual">双摄像头（各拍一方）</option>
            </select>
          </label>
          <label class="chk"><input type="checkbox" name="recognition_enabled"> 启用识别</label>
        </div>

        <fieldset>
          <legend>单摄像头</legend>
          <div class="row">
            <label>视频源
              <input type="text" name="s_url" placeholder="http://ip:4581/video/0 或 0">
            </label>
            <label>player1 位置
              <select name="s_side">
                <option value="left">画面左侧</option>
                <option value="right">画面右侧</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>双摄像头</legend>
          <div class="row">
            <label class="chk"><input type="checkbox" name="d_swap"> 交换两路与玩家的对应</label>
          </div>
          <div class="row">
            <label>摄像头1 视频源<input type="text" name="d_url1"></label>
            <label>对应玩家
              <select name="d_p1"><option value="1">player1</option><option value="2">player2</option></select>
            </label>
            <label>画面方向
              <select name="d_o1">
                <option value="horizontal">横向（3×7）</option>
                <option value="vertical">竖向（7×3）</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>摄像头2 视频源<input type="text" name="d_url2"></label>
            <label>对应玩家
              <select name="d_p2"><option value="1">player1</option><option value="2">player2</option></select>
            </label>
            <label>画面方向
              <select name="d_o2">
                <option value="horizontal">横向（3×7）</option>
                <option value="vertical">竖向（7×3）</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>识别参数</legend>
          <div class="row">
            <label>正面置信度<input type="number" step="0.001" min="0" max="1" name="front_conf"></label>
            <label>卡背置信度<input type="number" step="0.001" min="0" max="1" name="back_conf"></label>
            <label>卡名阈值<input type="number" step="0.001" min="0" max="1" name="name_thr"></label>
          </div>
          <div class="row">
            <label>识别间隔(秒)<input type="number" step="0.001" min="0.05" name="interval"></label>
            <label>最小边长(px)<input type="number" step="1" min="1" name="min_side"></label>
          </div>
          <div class="row">
            <label>推理设备<input type="text" name="device" placeholder="0=GPU，cpu=CPU"></label>
            <label>卡名重识别间隔(秒)<input type="number" step="0.001" min="0" name="name_cache_ttl"></label>
            <label class="chk"><input type="checkbox" name="track"> OBB 跟踪</label>
          </div>
          <div class="row">
            <label>丢帧防闪保持(秒)<input type="number" step="0.1" min="0" name="cell_hold" title="这一轮没识别到的格沿用上一轮的卡，超时才真清空；0=关闭"></label>
            <label>定位方块屏蔽(px)<input type="number" step="1" min="0" name="marker_drop_radius" title="校准方块中心半径内直接丢弃检测框（过滤鬼影卡）；0=不屏蔽"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>模型路径</legend>
          <div class="row">
            <label>正面检测<input type="text" name="m_yolo_front"></label>
            <label>卡背检测<input type="text" name="m_yolo_back"></label>
          </div>
          <div class="row">
            <label>卡名 ONNX<input type="text" name="m_name_onnx"></label>
            <label>卡名库<input type="text" name="m_names_json"></label>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit">保存并应用</button>
          <span id="save-msg"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>卡名黑名单 <small>（这些 card_id 不按卡面处理）</small></h2>
      <p class="hint">一行一个 card_id，支持 <code>#</code> 注释。保存后立即生效，无需重启识别。</p>
      <textarea id="blacklist-text" rows="8" spellcheck="false"></textarea>
      <div class="actions">
        <button type="button" id="blacklist-save">保存黑名单</button>
        <span id="blacklist-msg"></span>
      </div>
    </section>

    <section class="panel">
      <h2>视频预览 <small>（叠加框为识别到的卡牌；定位完成后再显示战场网格）</small></h2>
      <div id="previews" class="previews"></div>
    </section>

    <section class="panel">
      <h2>采集端 monitor</h2>
      <p class="hint">会通知当前配置里的采集端修改帧率/分辨率，并写回其 config.json；修改分辨率后采集端会重新打开摄像头。</p>
      <div class="row">
        <label>采集帧率(fps)
          <input type="number" id="monitor-fps" min="1" max="60" step="1" value="5">
        </label>
        <button type="button" id="monitor-fps-send">下发帧率</button>
        <span id="monitor-fps-msg"></span>
      </div>
      <div class="row">
        <label>采集分辨率
          <select id="monitor-res">
            <option value="640x360">640×360 (360p)</option>
            <option value="854x480">854×480 (480p)</option>
            <option value="960x540" selected>960×540 (540p)</option>
            <option value="1280x720">1280×720 (720p)</option>
            <option value="1920x1080">1920×1080 (1080p)</option>
          </select>
        </label>
        <button type="button" id="monitor-res-send">下发分辨率</button>
        <span id="monitor-res-msg"></span>
      </div>
    </section>

    <section class="panel">
      <h2>定位 / 校准 <small>（框选玩家区域 → 定位方块 → 横向 3×7 / 竖向 7×3 网格）</small></h2>
      <div class="row">
        <label>定位方式
          <select id="calib-mode">
            <option value="auto">自动检测定位方块</option>
            <option value="manual">手动标记定位标识</option>
          </select>
        </label>
      </div>
      <p class="hint" id="calib-hint"></p>
      <div id="calib-previews" class="previews"></div>
      <div class="actions">
        <button type="button" id="calib-run">开始定位</button>
        <button type="button" id="calib-clear" class="ghost">清除框选</button>
        <button type="button" id="guide-show">显示定位方块</button>
        <button type="button" id="guide-hide" class="ghost">隐藏定位方块</button>
        <span id="calib-msg"></span>
      </div>
    </section>

    <section class="panel">
      <h2>运行状态</h2>
      <pre id="status-json">…</pre>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
