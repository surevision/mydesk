<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YGO DESK · 控制端</title>
  <link rel="stylesheet" href="css/cyberpunk.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-tx"><b>YGO DESK</b><small>PROJECTION CONTROL</small></span>
      </div>

      <div class="conn">
        <span class="conn-dot disconnected" id="conn-dot"></span>
        <span class="conn-text" id="conn-status">未连接</span>
        <button class="cy-btn cy-btn--sm cy-btn--ghost" id="btn-reconnect">重连</button>
        <button class="cy-btn cy-btn--sm" id="btn-config">配置</button>
      </div>

      <div class="controls">
        <button class="cy-btn cy-btn--sm" id="btn-import-1">导入卡组 P1</button>
        <button class="cy-btn cy-btn--sm" id="btn-import-2">导入卡组 P2</button>
        <button class="cy-btn cy-btn--sm" id="btn-phase">阶段</button>
        <button class="cy-btn cy-btn--sm" id="btn-summon">召唤</button>
        <button class="cy-btn cy-btn--exec cy-btn--sm" id="btn-attack">攻击</button>
        <button class="cy-btn cy-btn--exec cy-btn--sm" id="btn-relate">关联</button>
        <button class="cy-btn cy-btn--sm" id="btn-bgm">BGM</button>
        <button class="cy-btn cy-btn--sm" id="btn-se">音效</button>
        <button class="cy-btn cy-btn--sm" id="btn-dice">骰子</button>
        <button class="cy-btn cy-btn--sm" id="btn-coin">硬币</button>
      </div>
    </header>

    <main id="board" class="board"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
